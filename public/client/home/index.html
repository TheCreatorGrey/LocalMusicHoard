<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMH</title>

    <link rel="stylesheet" href="style.css">

    <link id="icon" rel="icon" href="/assets/default.svg">
</head>
<body>

    <div id="main_column">
        <img src="/assets/headbang.gif" id="loading_indicator" style="position: absolute; top: 50%; left: 50%; transform: translateX(-50%) translateY(-50%); z-index: 999;">

        <div id="head_bar">
            <img class="head_button" src="/assets/home.svg" id="home_btn">
            <textarea name="Search Bar" id="search_bar" placeholder="Search for a track..."></textarea>
            <img class="head_button" src="/assets/search.svg" id="search_btn">
            <img class="head_button" src="/assets/default.svg" id="new_btn">
        </div>

        <div id="playlist_bar">
        </div>

        <div id="content_area">
        </div>
    
        <div id="playback_bar">
            <img src="/assets/default.svg" alt="album cover" id="album_cover">
            <div id="playback_controls_area">
                <div id="now_playing_title">Nothing is playing yet.</div>
                <audio controls id="audio">
                    <source id="audio_source" src="/tracks/0_0.mkv" type="audio/mpeg">
                </audio>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
    <script src="menu.js"></script>
</body>
</html>
